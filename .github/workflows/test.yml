name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887897cc827dbd23f380e21955fbdd8544e390eb # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run ruff
        run: uv run ruff check openmlr/ tests/
        working-directory: backend

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d792d818ab5f8c61749 # v4.0.0
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        working-directory: frontend

      - name: Run ESLint
        run: pnpm lint
        working-directory: frontend

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887897cc827dbd23f380e21955fbdd8544e390eb # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest tests/ -v --tb=short
        working-directory: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d792d818ab5f8c61749 # v4.0.0
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        working-directory: frontend

      - name: Type check
        run: pnpm run build
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm test
        working-directory: frontend

  test-docs:
    name: Docs Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: site

      - name: Build docs
        run: npm run docs:build
        working-directory: site
